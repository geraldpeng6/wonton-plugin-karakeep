# 上游镜像发新版时开 PR，标签和摘要一起改；PR 跑插件自己的检查。
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    ignore:
      # Meilisearch 有自己的数据卷，大版本升级要先按上游指南迁移索引
      # （docs.karakeep.com/administration/meilisearch-upgrade），不自动升。
      - dependency-name: "getmeili/meilisearch"
        update-types: ["version-update:semver-major"]
